<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dead File - Estilo Recorte Real</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: monospace;
            text-align: center;
            overflow: hidden;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }

        #oficina {
            position: relative;
            width: 90vw;
            max-width: 600px;
            height: 350px;
            background: #22222c;
            border: 4px solid #444;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            cursor: pointer;
            overflow: hidden;
        }

        /* Oliver como recorte de cartón plano */
        #oliver {
            position: absolute;
            font-size: 50px;
            left: 250px;
            top: 150px;
            user-select: none;
            transform-origin: bottom center; /* Pivota desde los pies como un títere */
        }

        /* Animación estilo recorte físico: saltitos y tirones de rotación */
        .recorte-caminando {
            animation: tironesPapel 0.18s infinite steps(2, start);
        }

        @keyframes tironesPapel {
            0% { transform: translateY(0px) rotate(-10deg); }
            50% { transform: translateY(-8px) rotate(0deg); }
            100% { transform: translateY(0px) rotate(10deg); }
        }

        .instrucciones {
            margin-top: 20px;
            color: #777;
            font-size: 13px;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <h2>DEAD FILE // Test Movimiento "Recorte de Papel"</h2>
    
    <div id="oficina">
        <div id="oliver">👱‍♂️</div>
    </div>

    <div class="instrucciones">
        Toca o haz clic en la oficina. Observa cómo el monigote se mueve a tirones y pivota desde los pies, exactamente igual a un recorte físico.
    </div>

    <script>
        const oficina = document.getElementById('oficina');
        const oliver = document.getElementById('oliver');

        let posX = 250;
        let posY = 150;
        let destinoX = 250;
        let destinoY = 150;
        let estaCaminando = false;
        
        // Velocidad constante y un poco más directa (estilo marioneta)
        const velocidad = 4;

        oficina.addEventListener('pointerdown', (e) => {
            const rect = oficina.getBoundingClientRect();
            destinoX = e.clientX - rect.left;
            destinoY = e.clientY - rect.top;
            estaCaminando = true;
            oliver.classList.add('recorte-caminando');
        });

        function gameLoop() {
            if (estaCaminando) {
                let distX = destinoX - posX;
                let distY = destinoY - posY;
                let distanciaTotal = Math.sqrt(distX * distX + distY * distY);

                if (distanciaTotal > velocidad) {
                    // Avance lineal y rígido (sin aceleraciones suaves de computadora)
                    posX += (distX / distanciaTotal) * velocidad;
                    posY += (distY / distanciaTotal) * velocidad;

                    // Voltear de golpe el recorte a la izquierda o derecha
                    if (distX < 0) {
                        oliver.style.transform = "scaleX(-1)";
                    } else {
                        oliver.style.transform = "scaleX(1)";
                    }
                } else {
                    // Detenerse de golpe al llegar al sitio
                    posX = destinoX;
                    posY = destinoY;
                    estaCaminando = false;
                    oliver.classList.remove('recorte-caminando');
                    // Reiniciar rotación a cero al parar
                    oliver.style.transform = "rotate(0deg)";
                }

                oliver.style.left = posX + 'px';
                oliver.style.top = posY + 'px';
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>

</body>
</html>
