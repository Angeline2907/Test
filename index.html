<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dead File - Test Toque Táctil</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: monospace;
            text-align: center;
            overflow: hidden;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            touch-action: manipulation; /* Evita zooms molestos al tocar rápido */
        }

        /* El escenario de la oficina */
        #oficina {
            position: relative;
            width: 90vw;
            max-width: 600px;
            height: 350px;
            background: #2c2c38;
            border: 4px solid #4a4a5e;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        /* Oliver estilo recorte */
        #oliver {
            position: absolute;
            font-size: 50px;
            left: 250px;
            top: 150px;
            user-select: none;
            transition: transform 0.1s ease;
            transform: translate(-50%, -50%); /* Centra el origen del movimiento */
        }

        /* Animación tipo South Park al caminar */
        .caminando {
            animation: balanceoPapel 0.2s infinite alternate ease-in-out;
        }

        @keyframes balanceoPapel {
            0% { transform: translate(-50%, -50%) translateY(0px) rotate(-8deg); }
            100% { transform: translate(-50%, -50%) translateY(-6px) rotate(8deg); }
        }

        .instrucciones {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <h2>DEAD FILE // Test Toque Táctil</h2>
    
    <div id="oficina">
        <div id="oliver">👱‍♂️</div>
    </div>

    <div class="instrucciones">
        <b>Toca cualquier parte de la oficina</b> (o haz clic con el mouse) para que Oliver camine hacia allí.
    </div>

    <script>
        const oficina = document.getElementById('oficina');
        const oliver = document.getElementById('oliver');

        // Posición actual de Oliver
        let posX = 250;
        let posY = 150;

        // Posición a donde quiere llegar
        let destinoX = 250;
        let destinoY = 150;
        
        let estaCaminando = false;
        const velocidad = 3; // Velocidad de desplazamiento

        // Detectar toque en celular o clic en PC dentro del área de la oficina
        oficina.addEventListener('pointerdown', (e) => {
            const rect = oficina.getBoundingClientRect();
            // Calcula la posición exacta del toque dentro de la caja
            destinoX = e.clientX - rect.left;
            destinoY = e.clientY - rect.top;
            estaCaminando = true;
            oliver.classList.add('caminando');
        });

        function gameLoop() {
            if (estaCaminando) {
                // Distancia entre Oliver y el destino
                let distX = destinoX - posX;
                let distY = destinoY - posY;
                let distanciaTotal = Math.sqrt(distX * distX + distY * distY);

                if (distanciaTotal > 2) {
                    // Moverse paso a paso hacia el objetivo
                    posX += (distX / distanciaTotal) * velocidad;
                    posY += (distY / distanciaTotal) * velocidad;

                    // Voltear el sprite dependiendo de hacia dónde camina
                    if (distX < 0) {
                        oliver.style.transform = "translate(-50%, -50%) scaleX(-1)";
                    } else {
                        oliver.style.transform = "translate(-50%, -50%) scaleX(1)";
                    }
                } else {
                    // Si ya llegó al destino, se detiene
                    estaCaminando = false;
                    oliver.classList.remove('caminando');
                }

                // Aplicar posición en pantalla
                oliver.style.left = posX + 'px';
                oliver.style.top = posY + 'px';
            }

            requestAnimationFrame(gameLoop);
        }

        // Iniciar el bucle
        gameLoop();
    </script>

</body>
</html>
